# Configurations
title:            Quant Notes
longtitle:        Quant Knowledge Base
author:           Yourui Wang
email:            yw2735@cornell.edu
description: >
  Personal knowledge base of quant finance and probability notes.

url:              'https://yw0905.github.io'
baseurl:          ''

# Theme: GitBook-style Jekyll theme (sidebar TOC, MathJax, GFM tables, rouge highlighting).
# Vendored locally (_layouts/_includes/assets/gitbook, from sighingnow/jekyll-gitbook)
# instead of using `remote_theme:`, so local preview and CI don't depend on
# jekyll-remote-theme / a live network fetch of the theme at build time.

toc:
  enabled: true
  h_min:   1
  h_max:   3

favicon_path:     /assets/gitbook/images/favicon.ico

# markdown render engine
markdown:         kramdown
kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

syntax_highlighter_style: colorful

markdown_ext:             markdown,mkdown,mkdn,mkd,md

permalink:                /:categories/:year-:month-:day-:title:output_ext

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md

page_width: 1000px

destination:      ./_site
incremental:      false
regenerate:       true

plugins:
  - jekyll-feed
